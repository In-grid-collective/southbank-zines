http {
        ##
        # Logging Settings
        ##

        access_log /var/log/nginx/access.log;

        map $http_user_agent $device {
            ~*bot|crawler|spider|slurp|bingpreview   bot;
            ~*ipad|tablet                            tablet;
            ~*mobile|android|iphone                  mobile;
            default                                  desktop;
        }

        map $http_user_agent $browser {
            ~*firefox    firefox;
            ~*edg/       edge;
            ~*chrome     chrome;
            ~*safari     safari;
            default      other;
        }

        #log_format redacted '[$time_local] '
        #                   '"$request" $status $body_bytes_sent '
        #                   '"$http_referer"';

        log_format redacted 'time="$time_iso8601" msg="$request_method $uri"  ┌↔─status─↔┐=$status ╚visitor═╬►=$browser•$device ├data┼size┤=$body_bytes_sent ◄┤="$http_referer"';

        access_log /var/log/nginx/redacted-access.log redacted;
}
